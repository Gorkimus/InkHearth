<!doctype html>
<html lang="en" data-theme="warm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkHearth</title>
<meta name="theme-color" content="#171310">
<script>
/* Theme is warm by default; a saved "classic" preference applies before the
   first paint so nobody sees a flash of the wrong palette. */
try { if (localStorage.getItem('bt-theme') === 'classic') document.documentElement.dataset.theme = 'classic'; } catch (e) {}
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InkHearth">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/icons/icon-192.png?v=2">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><img src="/icons/icon-192.png?v=2" alt="">InkHearth</div>
  <nav>
    <a href="#dashboard">The Hearth</a>
    <a href="#library">Library</a>
    <a href="#board">Tier board</a>
    <a href="#compare">Compare</a>
    <a href="#members">Members</a>
    <a href="#tbr">TBR</a>
    <a href="#recs">For you</a>
    <!-- HIBERNATING Sept 25 2026 (Storyteller Selection): re-add to wake —
    <a href="#storytellers">Storytellers</a> -->
    <a href="#add" class="cta">＋ Log a book</a>
    <a href="#memory">Memory lane</a>
  </nav>
  <div id="user-menu" class="user-menu"></div>
</header>
<main id="view"></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card" tabindex="-1"></div></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
